name: Release EdgeApp

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x64 (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libserialport-dev \
            libmpv-dev \
            mpv \
            libasound2-dev \
            libpulse-dev \
            libsqlite3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop --no-analytics

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux Release Bundle
        run: flutter build linux --release

      - name: Add Helper Scripts
        run: |
          cat << 'EOF' > build/linux/x64/release/bundle/run.sh
          #!/bin/bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          cd "$DIR"
          export LD_LIBRARY_PATH="$DIR/lib:$LD_LIBRARY_PATH"
          ./lobsense_edge_app "$@"
          EOF
          chmod +x build/linux/x64/release/bundle/run.sh
          chmod +x build/linux/x64/release/bundle/lobsense_edge_app

          cat << 'EOF' > build/linux/x64/release/bundle/setup-pipo-deps.sh
          #!/bin/bash
          echo "=== Menginstall dependensi runtime untuk LobSense Edge di Ubuntu 22.04 ==="
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0 libserialport0 libmpv-dev libmpv1 mpv libasound2 libsqlite3-0
          sudo usermod -aG dialout,audio $USER
          if [ -f /usr/lib/x86_64-linux-gnu/libmpv.so.1 ] && [ ! -f /usr/lib/x86_64-linux-gnu/libmpv.so.2 ]; then
            sudo ln -sf /usr/lib/x86_64-linux-gnu/libmpv.so.1 /usr/lib/x86_64-linux-gnu/libmpv.so.2 2>/dev/null || true
          fi
          echo "=== Selesai! Jika port serial baru dihubungkan, restart atau re-login sesi Ubuntu ==="
          echo "Jalankan: ./run.sh"
          EOF
          chmod +x build/linux/x64/release/bundle/setup-pipo-deps.sh

          cat << 'EOF' > build/linux/x64/release/bundle/create-desktop-shortcut.sh
          #!/bin/bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          ICON_PATH="$DIR/data/flutter_assets/assets/icon.png"
          if [ ! -f "$ICON_PATH" ]; then
            ICON_PATH="$DIR/data/flutter_assets/assets/images/logo.png"
          fi

          DESKTOP_ENTRY="[Desktop Entry]
          Version=1.0
          Type=Application
          Name=LobSense Edge
          Comment=LobSense Edge Gateway & Telemetry Monitoring
          Exec=$DIR/run.sh
          Icon=$ICON_PATH
          Terminal=false
          StartupNotify=true
          Categories=Utility;Science;"

          # Pasang ke Menu Aplikasi Ubuntu (Show Applications)
          mkdir -p "$HOME/.local/share/applications"
          echo "$DESKTOP_ENTRY" > "$HOME/.local/share/applications/lobsense.desktop"
          chmod +x "$HOME/.local/share/applications/lobsense.desktop"

          # Pasang ke Layar Desktop jika ada folder Desktop
          TARGET_DESKTOP="$HOME/Desktop"
          if [ -d "$TARGET_DESKTOP" ]; then
            echo "$DESKTOP_ENTRY" > "$TARGET_DESKTOP/lobsense.desktop"
            chmod +x "$TARGET_DESKTOP/lobsense.desktop"
            gio set "$TARGET_DESKTOP/lobsense.desktop" metadata::trusted true 2>/dev/null || true
          fi

          echo "=== Shortcut Desktop Berhasil Dibuat! ==="
          echo "Icon 'LobSense Edge' sekarang sudah tersedia di Menu Aplikasi & Desktop Ubuntu."
          EOF
          chmod +x build/linux/x64/release/bundle/create-desktop-shortcut.sh

      - name: Package Linux Bundle (.tar.gz)
        run: |
          cd build/linux/x64/release
          tar -czvf ../../../../lobsense_edge_app-linux-x64.tar.gz bundle/

      - name: Publish Linux Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: lobsense_edge_app-linux-x64.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
